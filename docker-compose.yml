services:
  postgres:
    image: postgres:16-alpine
    container_name: pixel-payload-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixel_payload
      POSTGRES_PASSWORD: payload
      POSTGRES_USER: payload
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d pixel_payload']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - payload_postgres_data:/var/lib/postgresql/data

volumes:
  payload_postgres_data:
